name: unit tests

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release", "develop" ]

jobs:
  check_unit_tests:
    runs-on: ubuntu-latest

    env:
      FULL_NAME: Иванова Екатерина Михайловна
      GROUP: M3113
      GITHUB_USERNAME: "harlyu"

    steps:
      - name: Вывод информации
        run: |
          echo "ФИО: $FULL_NAME"
          echo "Группа: $GROUP"
          echo "Ник на GitHub: $GITHUB_USERNAME"

      - name: Установка Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check code style
        run: |
          pip install flake8
          flake8 .
          
        
